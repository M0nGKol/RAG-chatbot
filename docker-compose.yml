version: "3.8"

services:
  bot:
    build: .
    container_name: rag-neo4j-telegram-bot
    env_file: .env
    restart: unless-stopped
    # No ports -- long-polling worker, makes outbound connections only
    # (Telegram, Gemini, Neo4j Aura). Nothing needs to be exposed.

  # Optional: only needed if you're running Neo4j locally instead of Aura.
  # If you're on Aura (NEO4J_URI=neo4j+s://...), you don't need this service
  # at all -- just run `docker compose up -d bot`.
  neo4j:
    image: neo4j:5.26-community
    container_name: rag-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/change-me-please
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./schema:/schema

volumes:
  neo4j_data:
  neo4j_logs:
